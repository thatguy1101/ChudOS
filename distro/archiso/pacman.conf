#
# pacman configuration used by mkarchiso to build the ChudOS live image.
# This file is NOT installed into the live system or the installed system.
#
[options]
HoldPkg      = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Local repository holding the ChudOS packages (chudos-defaults, chudos-welcome),
# built from this repository by `tools/build-iso/build.sh packages`.
# These packages are built locally and are unsigned; LocalFileSigLevel above
# (Optional) is what allows them. This is the ONLY non-Arch repository.
# @CHUDOS_REPO@ is replaced by tools/build-iso/stage_profile.py.
[chudos]
SigLevel = Optional TrustAll
Server = file://@CHUDOS_REPO@
